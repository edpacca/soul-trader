<div id="notes-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3>Edit Note</h3>
        <div style="display: flex; align-items: center; margin-bottom: 10px; gap: 8px;">
            <input type="checkbox" id="readable-format-toggle" checked>
            <label for="readable-format-toggle" style="margin: 0; font-size: 0.9em;">Readable format</label>
        </div>
        <textarea id="note-text" maxlength="5000" rows="4" style="width: 100%;"></textarea>
        <p id="note-char-count" style="text-align: right; font-size: 0.85em; color: #666;">0 / 5000</p>
        <div class="modal-actions">
            <button id="save-note-btn">Save</button>
            <button id="delete-note-btn">Delete</button>
            <button id="cancel-note-btn">Cancel</button>
        </div>
    </div>
</div>
